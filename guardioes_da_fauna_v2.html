// ─────────────────────────────────────────────────────────────
// SPRITE ENGINE — cria sprites pixel a pixel via offscreen canvas
// Cada sprite é uma paleta + mapa de pixels
// ─────────────────────────────────────────────────────────────
function makeSprite(w,h,pixels){
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const ox=oc.getContext('2d');ox.imageSmoothingEnabled=false;
  const id=ox.createImageData(w,h);const d=id.data;
  for(let i=0;i<pixels.length;i++){
    const v=pixels[i];if(!v||v===0)continue;
    const r=(v>>16)&255,g=(v>>8)&255,b=v&255,a=255;
    d[i*4]=r;d[i*4+1]=g;d[i*4+2]=b;d[i*4+3]=a;
  }
  ox.putImageData(id,0,0);return oc;
}

// Escala de sprites para pixel art visível
function spr(img,x,y,s=3,flipX=false){
  X.save();
  if(flipX){X.scale(-1,1);x=-(x+img.width*s);}
  X.drawImage(img,Math.floor(x),Math.floor(y),img.width*s,img.height*s);
  X.restore();
}

// Cipó (16x96 — elemento vertical Mata Atlântica)
function makeCipo(){
const V1=0x2A8018,V2=0x1A6010,V3=0x3AAA28,BK=0x1A0F00;
const row=[V2,V1,V3,V2,V1,V2,V3,V1,V2,V1,V2,V3,V1,V2,V1,V2];
const arr=[];
for(let r=0;r<96;r++){
  const shift=Math.floor(r/8)%3;
  for(let c=0;c<16;c++){
    if(c===7||c===8) arr.push(V3);
    else if(c===6||c===9) arr.push(r%4<2?V1:V2);
    else if(c<4||c>11) arr.push(0);
    else arr.push(row[(c+shift)%16]);
  }
}
return makeSprite(16,96,arr);}

// Texto pixel com escala
function px(txt,x,y,size,color,shadow=false){
  X.imageSmoothingEnabled=false;
  if(shadow){X.fillStyle='rgba(0,0,0,0.8)';X.font=`bold ${size}px "Courier New",monospace`;X.fillText(txt,x+2,y+2);}
  X.fillStyle=color;X.font=`bold ${size}px "Courier New",monospace`;X.fillText(txt,x,y);
}

// ─── MENUS ───
let menuInput=false;
function handleMenuKey(code){
  if(GS==='MENU'){
    if(code==='ArrowUp')menuSel=Math.max(0,menuSel-1);
    if(code==='ArrowDown')menuSel=Math.min(2,menuSel+1);
    if(code==='Enter'||code==='Space'){
      if(menuSel===0){biome=0;initBiome(0);GS='PLAYING';}
      if(menuSel===1)GS='BIOME_SELECT';
      if(menuSel===2)GS='BESTIARIO';
    }
  }
  if(GS==='BIOME_SELECT'){
    if(code==='ArrowLeft')biomeSel=Math.max(0,biomeSel-1);
    if(code==='ArrowRight')biomeSel=Math.min(3,biomeSel+1);
    if((code==='Enter'||code==='Space')&&biomeUnlocked[biomeSel]){initBiome(biomeSel);GS='PLAYING';}
    if(code==='Escape')GS='MENU';
  }
  if(GS==='BESTIARIO'&&code==='Escape')GS='MENU';
  if(GS==='PLAYING'&&code==='Escape')GS='MENU';
  if((GS==='GAMEOVER'||GS==='WIN')&&(code==='Enter'||code==='Space'))GS='MENU';
}

function drawBG_MataAtlantica(){
  // Céu verde-azul claro
  const g=X.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#6AB4E8');g.addColorStop(0.4,'#98D070');g.addColorStop(1,'#4A8A28');
  X.fillStyle=g;X.fillRect(0,0,800,500);
  // Camadas de árvores fundas
  for(let layer=0;layer<3;layer++){
    const par=0.15+layer*0.1;
    const ox=-(camX*par)%400;
    const baseG=['#1A5C0A','#2A7C1A','#3A9C2A'][layer];
    const topG=['#2A7C1A','#3A9C2A','#5ABF3A'][layer];
    for(let i=-1;i<4;i++){
      const tx=ox+i*400;
      // Arvore grande
      X.fillStyle=baseG;X.fillRect(tx+20,80+layer*20,30,350-layer*30);
      X.fillStyle=topG;
      X.beginPath();X.arc(tx+35,80+layer*20,55-layer*10,0,Math.PI*2);X.fill();
      X.fillStyle=baseG;
      X.beginPath();X.arc(tx+35,100+layer*20,40-layer*8,0,Math.PI*2);X.fill();
      // Segunda árvore
      X.fillStyle=baseG;X.fillRect(tx+180,100+layer*15,25,300);
      X.fillStyle=topG;X.beginPath();X.arc(tx+192,100+layer*15,45-layer*8,0,Math.PI*2);X.fill();
    }
  }
  // Cipós animados
  X.strokeStyle='#2A8018';X.lineWidth=3;
  for(let i=0;i<6;i++){
    const cx=((i*180+40)-(camX*0.5))%900;
    const phase=Math.sin(frame*0.015+i)*12;
    X.beginPath();X.moveTo(cx,0);
    X.bezierCurveTo(cx+phase,120,cx-phase,250,cx+phase*0.5,420);X.stroke();
  }
  // Cascata
  const wfx=(450-(camX*0.4)%600+600)%600+100;
  X.fillStyle='rgba(160,210,255,0.7)';
  for(let w=0;w<3;w++)X.fillRect(wfx+w*4,60,3,200+Math.sin(frame*0.1+w)*10);
  X.fillStyle='rgba(200,230,255,0.4)';X.fillRect(wfx-15,255,40,12);
}

  // Margem superior - troncos e folhagem
  const treeOx=-(camX*0.3)%500;
  for(let i=-1;i<4;i++){
    const tx=treeOx+i*500;
    X.fillStyle='#1A6A0A';X.fillRect(tx,0,35,260);
    X.fillStyle='#2A9A1A';X.beginPath();X.arc(tx+17,50,65,0,Math.PI*2);X.fill();
    X.fillStyle='#1A6A0A';X.beginPath();X.arc(tx+17,70,50,0,Math.PI*2);X.fill();
    X.fillStyle='#1A6A0A';X.fillRect(tx+200,0,28,240);
    X.fillStyle='#3AAB2A';X.beginPath();X.arc(tx+214,60,55,0,Math.PI*2);X.fill();
  }
  // Linha d'água
  X.fillStyle='rgba(255,255,255,0.3)';
  for(let w=0;w<8;w++){
    const wx=((w*120-(camX*0.4))%1000+1000)%1000;
    X.fillRect(wx,240+Math.sin(frame*0.04+w)*3,80,3);
  }
  // Vitórias-régias (plataformas flutuantes visuais)
  for(let i=0;i<5;i++){
    const lx=((i*200+60-(camX*0.6))%1200+1200)%1200;
    X.fillStyle='#2A8A1A';X.beginPath();X.ellipse(lx,250,55,14,0,0,Math.PI*2);X.fill();
    X.fillStyle='#1A6A0A';X.beginPath();X.ellipse(lx,250,55,14,0,0,Math.PI);X.stroke();
    // Flor
    X.fillStyle='#F8D0E0';X.beginPath();X.arc(lx,243,8,0,Math.PI*2);X.fill();
    X.fillStyle='#F0A0B8';X.beginPath();X.arc(lx,243,5,0,Math.PI*2);X.fill();
  }
  // Fundo do rio — plantas
  for(let i=0;i<8;i++){
    const px=((i*110-(camX*0.7))%1000+1000)%1000;
    X.fillStyle='#1A6C2A';X.fillRect(px,360,6,80);
    X.fillStyle='#2A9C3A';X.beginPath();X.ellipse(px+3,355,15,10,0,0,Math.PI*2);X.fill();
  }
  // Bolhas
  for(let i=0;i<5;i++){
    const bx=((i*160+frame*1.5)%800);
    const by=500-((frame*0.8+i*90)%180);

      X.beginPath();X.arc(bx,by,2+i%3,0,Math.PI*2);X.stroke();
    }
  }
}

function drawBG_Cerrado(){

  const g=X.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#C46808');g.addColorStop(0.5,'#E08020');g.addColorStop(1,'#B85010');
  X.fillStyle=g;X.fillRect(0,0,800,500);
  // Sol grande
  const sg=X.createRadialGradient(640,90,5,640,90,70);
  sg.addColorStop(0,'#FFEE80');sg.addColorStop(0.4,'#FFD020');sg.addColorStop(1,'rgba(255,160,0,0)');
  X.fillStyle=sg;X.fillRect(570,20,160,160);
  // Árvores retorcidas do Cerrado
  const tox=-(camX*0.35)%500;
  for(let i=-1;i<5;i++){
    const tx=tox+i*500;
    X.strokeStyle='#4A2808';X.lineWidth=7;
    // Tronco torto
    X.beginPath();X.moveTo(tx+30,430);X.bezierCurveTo(tx+25,350,tx+40,310,tx+28,250);X.stroke();
    // Galhos
    X.lineWidth=3;
    X.beginPath();X.moveTo(tx+28,280);X.lineTo(tx+65,248);X.stroke();
    X.beginPath();X.moveTo(tx+28,265);X.lineTo(tx-8,240);X.stroke();
    X.beginPath();X.moveTo(tx+28,295);X.lineTo(tx+55,270);X.stroke();
    // Folhagem (amarelo-laranja)
    X.fillStyle='#C07010';X.beginPath();X.arc(tx+28,242,28,0,Math.PI*2);X.fill();
    X.fillStyle='#E09030';X.beginPath();X.arc(tx+28,242,20,0,Math.PI*2);X.fill();
    X.fillStyle='#C07010';X.beginPath();X.arc(tx+65,240,20,0,Math.PI*2);X.fill();
    X.fillStyle='#C07010';X.beginPath();X.arc(tx-8,232,18,0,Math.PI*2);X.fill();
    // Segunda árvore
    X.strokeStyle='#4A2808';X.lineWidth=5;
    X.beginPath();X.moveTo(tx+280,430);X.bezierCurveTo(tx+275,370,tx+290,330,tx+283,280);X.stroke();
    X.fillStyle='#C07010';X.beginPath();X.arc(tx+283,272,24,0,Math.PI*2);X.fill();
  }
  // Chão rachado
  X.fillStyle='#804010';
  for(let i=0;i<15;i++){
    const cx=((i*60-(camX*0.9))%1000+1000)%1000;
    X.strokeStyle='#5A2808';X.lineWidth=1;
    X.beginPath();X.moveTo(cx,420);X.lineTo(cx+15,427);X.lineTo(cx+28,420);X.stroke();
    X.beginPath();X.moveTo(cx+10,422);X.lineTo(cx+20,430);X.stroke();
  }
  // Focos de incêndio (do GDD — criados pelos robôs)
  for(let i=0;i<4;i++){
    const fx=((i*250-(camX*0.85))%1100+1100)%1100;
    // Pedras base
    for(let s=0;s<4;s++){X.fillStyle='#888';X.beginPath();X.arc(fx+s*8+4,424,5,0,Math.PI*2);X.fill();}
    // Chamas animadas multicamada
    const t=frame*0.12;
    const h1=18+Math.sin(t+i)*6,h2=14+Math.sin(t+i+1)*5,h3=10+Math.sin(t+i+2)*4;
    X.fillStyle='rgba(180,20,0,0.9)';
    X.beginPath();X.moveTo(fx+2,424);X.lineTo(fx+16,424-h1);X.lineTo(fx+30,424);X.closePath();X.fill();
    X.fillStyle='rgba(255,90,0,0.9)';
    X.beginPath();X.moveTo(fx+5,424);X.lineTo(fx+16,424-h2);X.lineTo(fx+27,424);X.closePath();X.fill();
    X.fillStyle='rgba(255,170,0,0.9)';
    X.beginPath();X.moveTo(fx+9,424);X.lineTo(fx+16,424-h3);X.lineTo(fx+23,424);X.closePath();X.fill();
    X.fillStyle='rgba(255,240,100,0.8)';
    X.beginPath();X.moveTo(fx+13,424);X.lineTo(fx+16,424-8);X.lineTo(fx+19,424);X.closePath();X.fill();
  }
}

function drawBG_Pantanal(){
  // Pôr do sol dramático do GDD
  const g=X.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#180828');g.addColorStop(0.3,'#7A1540');
  g.addColorStop(0.55,'#C83808');g.addColorStop(0.7,'#E06818');
  g.addColorStop(0.82,'#F0A040');g.addColorStop(1,'#182840');
  X.fillStyle=g;X.fillRect(0,0,800,500);
  // Sol
  const sg=X.createRadialGradient(400,285,0,400,285,75);
  sg.addColorStop(0,'rgba(255,255,200,1)');sg.addColorStop(0.3,'rgba(255,210,50,0.9)');
  sg.addColorStop(0.7,'rgba(255,140,0,0.5)');sg.addColorStop(1,'rgba(255,100,0,0)');
  X.fillStyle=sg;X.fillRect(280,200,240,200);
  // Água + reflexo
  X.fillStyle='rgba(20,40,70,0.92)';X.fillRect(0,350,800,150);
  // Reflexo do sol na água
  X.fillStyle='rgba(255,170,40,0.35)';
  for(let r=-4;r<=4;r++){
    const rw=Math.max(2,10-Math.abs(r)*2);
    X.fillRect(400+r*18-rw/2,350,rw,150);
  }
  // Silhuetas árvores secas (estilo do GDD)
  const tox=-(camX*0.25)%700;
  for(let i=-1;i<4;i++){
    const tx=tox+i*700;
    X.fillStyle='#080808';
    // Árvore seca alta
    X.fillRect(tx+20,150,10,205);
    X.fillRect(tx+10,200,8,6);X.fillRect(tx+30,230,7,6);
    X.fillRect(tx+10,270,8,6);X.fillRect(tx+30,290,7,6);
    // Palmeira
    X.fillRect(tx+200,200,8,155);
    for(let f2=0;f2<5;f2++){
      X.strokeStyle='#080808';X.lineWidth=3;
      const angle=(f2/5)*Math.PI-Math.PI*0.6;
      X.beginPath();X.moveTo(tx+204,200);
      X.lineTo(tx+204+Math.cos(angle)*45,200+Math.sin(angle)*28);X.stroke();
    }
  }
  // Reflexo silhuetas na água
  X.save();X.globalAlpha=0.3;
  const tox2=-(camX*0.25)%700;
  for(let i=-1;i<4;i++){
    const tx=tox2+i*700;
    X.fillStyle='#000';X.fillRect(tx+20,350,10,80);
    X.fillRect(tx+200,350,8,60);
  }
  X.restore();
  // Ondulações da água
  for(let i=0;i<6;i++){
    const rx=((i*140+frame*0.5)%900);
    X.strokeStyle=`rgba(255,160,60,0.15)`;X.lineWidth=1;
    X.beginPath();X.ellipse(rx,370+i*14,35,6,0,0,Math.PI*2);X.stroke();
  }
}

// ─────────────────────────────────────────────────────────────
// DRAW PLATFORMS — tiles fiéis ao bioma
// ─────────────────────────────────────────────────────────────
function drawPlatform(plt){
  if(plt.ground){
    // Chão tileado
    const tile=biome===0?SPR.tileGrass:biome===1?SPR.tileWater:biome===2?SPR.tileCerrado:SPR.tilePantanal;
    const startX=Math.floor((plt.x-camX)/TW)*TW;
    const endX=startX+900;
    for(let tx=startX;tx<endX;tx+=TW){
      X.drawImage(tile,Math.floor(tx),plt.y,TW,TH*3);
    }
    return;
  }
  // Plataforma suspensa — tileada
  const tile=biome===0?SPR.tileGrass:biome===1?SPR.tileWater:biome===2?SPR.tileCerrado:SPR.tilePantanal;
  const sx=plt.x-camX;
  for(let tx=0;tx<plt.w;tx+=TW){
    X.drawImage(tile,Math.floor(sx+tx),plt.y,TW,TH);
  }
  // Borda inferior
  X.fillStyle=biome===0?'rgba(60,100,20,0.6)':biome===1?'rgba(10,60,80,0.6)':biome===2?'rgba(100,50,10,0.6)':'rgba(20,50,30,0.6)';
  X.fillRect(Math.floor(sx),plt.y+TH,plt.w,4);
}

// ─────────────────────────────────────────────────────────────
// DRAW ENEMIES — sprites fiéis ao GDD
// ─────────────────────────────────────────────────────────────
function drawEnemy(en){
  const ex=en.x-camX;
  if(ex<-80||ex>900)return;
  
  if(en.disabled>0){
    X.save();X.globalAlpha=0.45;
    drawEnemySprite(en,ex);
    X.restore();
    // ZZZ
    if(frame%30<15){
      const zx=ex+20+((frame/30|0)%3)*8;
      const zy=en.y-80+((en.disabled)%30);
      px('Z',zx,zy,12,'#AACCFF',true);
    }
    return;
  }
  drawEnemySprite(en,ex);
}

function drawEnemySprite(en,ex){
  if(en.t==='robot'){
    // Flip direction
    const flipX=en.vx>0;
    X.save();
    if(flipX){X.scale(-1,1);X.translate(-800,0);}
    X.drawImage(SPR.robot,Math.floor(flipX?800-ex-72:ex-12),en.y-60,72,60);
    X.restore();
  }else if(en.t==='drone'){
    const dy=en.sx+(Math.sin(frame*0.04)*30);
    X.drawImage(SPR.drone,Math.floor(ex-30),Math.floor(dy-25),60,48);
    // Propelas animadas (linhas rápidas)
    X.strokeStyle='rgba(200,200,200,0.6)';X.lineWidth=2;
    const ang=(frame*15)*Math.PI/180;
    X.save();X.translate(ex-30+9,Math.floor(dy-25)+6);X.rotate(ang);
    X.beginPath();X.moveTo(-12,0);X.lineTo(12,0);X.stroke();X.restore();
    X.save();X.translate(ex-30+45,Math.floor(dy-25)+6);X.rotate(-ang);
    X.beginPath();X.moveTo(-12,0);X.lineTo(12,0);X.stroke();X.restore();
  }else if(en.t==='pesado'){
    X.drawImage(SPR.pesado,Math.floor(ex-36),en.y-84,72,84);
  }
}

function drawAnimalSprite(an){
  const ax=an.x-camX;
  if(ax<-60||ax>860)return;
  const sprK=ANIMAL_INFO[an.type].spr;
  const s=SPR[sprK];
  // Escala variada por animal para parecer natural
  const sc={'mico':2.8,'tucano':3,'preguica':2.8,'boto':3,'arara':3,'lobo':3.5,'capivara':3,'onca':3.5};
  const scale=sc[an.type]||3;
  const float=Math.sin(frame*0.05+an.x*0.01)*2;
  X.drawImage(s,Math.floor(ax-s.width*scale/2),Math.floor(an.y-s.height*scale+float),s.width*scale,s.height*scale);
  // Ícone de interação próximo
  if(an.active){
    const px2=P.x-camX,py2=P.y;
    const dist=Math.hypot(px2-(ax),py2-(an.y));
    if(dist<90){
      // Balão de diálogo pixel
      const bx=ax-20,by=an.y-s.height*scale-30;
      X.fillStyle='rgba(255,255,230,0.95)';X.fillRect(bx,by,50,20);
      X.strokeStyle='#8B4513';X.lineWidth=2;X.strokeRect(bx,by,50,20);
      X.fillStyle='rgba(255,255,230,0.95)';
      X.beginPath();X.moveTo(bx+20,by+20);X.lineTo(bx+15,by+28);X.lineTo(bx+30,by+20);X.closePath();X.fill();
      X.strokeStyle='#8B4513';
      X.beginPath();X.moveTo(bx+20,by+20);X.lineTo(bx+15,by+28);X.lineTo(bx+30,by+20);X.stroke();
      px('[E]',bx+8,by+15,11,'#2A1800',false);
    }
  }
}

// ─────────────────────────────────────────────────────────────
// DRAW LEO
// ─────────────────────────────────────────────────────────────
function drawLeo(){
  if(P.invTimer>0&&frame%6<3)return;
  const lx=P.x-camX;
  // Frame de animação
  let fi=0;
  if(P.binTimer>0)fi=3;
  else if(!P.onGround)fi=1;
  else fi=P.walkFrame;
  const flip=P.dir<0;
  const s=SPR.leo[fi];
  X.save();
  if(flip){X.scale(-1,1);X.drawImage(s,-(lx+s.width*SCALE),P.y-s.height*SCALE,s.width*SCALE,s.height*SCALE);}
  else X.drawImage(s,lx,P.y-s.height*SCALE,s.width*SCALE,s.height*SCALE);
  X.restore();
  // Raio do binóculo
  if(P.binTimer>0){
    const bx=lx+(P.dir>0?s.width*SCALE:0);
    const len=150+P.binTimer*2;
    const grad=X.createLinearGradient(bx,P.y-20,bx+P.dir*len,P.y-20);
    grad.addColorStop(0,'rgba(100,255,100,0.9)');
    grad.addColorStop(0.6,'rgba(150,255,150,0.5)');
    grad.addColorStop(1,'rgba(100,255,100,0)');
    X.fillStyle=grad;X.fillRect(P.dir>0?bx:bx-len,P.y-24,len,10);
    // Partículas de luz solar
    for(let p=0;p<4;p++){
      const px2=bx+P.dir*(30+p*35);
      const py2=P.y-20+Math.sin(frame*0.3+p)*5;
      X.fillStyle=`rgba(150,255,150,${0.8-p*0.2})`;
      X.fillRect(px2,py2,4,4);
    }
  }
}

      X.fillStyle='#4ACA2A';X.fillRect(cx+160,cy+6,18,18);
      px('✓',cx+162,cy+20,13,'#FFF',false);
    }else{
      // Silhueta
      X.fillStyle='#140A00';X.fillRect(cx+6,cy+6,173,140);
      X.fillStyle='rgba(40,20,0,0.5)';X.fillRect(cx+8,cy+8,169,136);
      px('?',cx+78,cy+78,48,'#2A1400',true);
      px('???',cx+64,cy+155,12,'#2A1400');
      px('Não descoberto',cx+22,cy+172,9,'#1A0C00');
    }
  });
  X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,462,800,38);
  px('ESC: Voltar   •   Explore os biomas para descobrir todos os animais!',90,483,11,'#8B5E3C');
}

// ─────────────────────────────────────────────────────────────
// GAME OVER / WIN
// ─────────────────────────────────────────────────────────────
function drawGameOver(){
  X.fillStyle='rgba(0,0,0,0.82)';X.fillRect(0,0,800,500);
  X.fillStyle='#CC0000';X.fillRect(150,160,500,180);
  X.fillStyle='#880000';X.fillRect(154,164,492,172);
  X.strokeStyle='#FF4444';X.lineWidth=4;X.strokeRect(152,162,496,176);
  px('GAME OVER',185,245,48,'#FF3333',true);
  px('Os robôs capturaram Leo...',215,285,13,'#FF8888',true);
  px('PRESSIONE ENTER para o menu',205,330,13,'#FFAA88',true);
}

function drawWin(){
  const g=X.createLinearGradient(0,0,0,500);
  g.addColorStop(0,'#042A04');g.addColorStop(1,'#0A4A14');
  X.fillStyle=g;X.fillRect(0,0,800,500);
  // Confetti
  const confColors=['#FFDD44','#FF4488','#44FF88','#4488FF','#FF8844','#88FF44'];
  for(let i=0;i<25;i++){
    const cx2=((i*41+frame*2)%800);
    const cy2=((i*67+frame*1.5)%420)+40;
    X.fillStyle=confColors[i%6];X.fillRect(cx2,cy2,6,6);
  }
  X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(100,60,600,340);
  X.fillStyle='rgba(20,80,10,0.9)';X.fillRect(104,64,592,332);
  X.strokeStyle='#88FF44';X.lineWidth=4;X.strokeRect(102,62,596,336);
  px('PARABÉNS!',240,140,46,'#FFDD44',true);
  px('Protocolo Ferrugem DESATIVADO!',150,200,18,'#88FF88',true);
  px('Leo restaurou a harmonia da floresta!',140,232,13,'#AAFFAA',true);
  px(`Fauna catalogada: ${faunaCount} / ${Object.keys(ANIMAL_INFO).length}`,265,268,13,'#FFDD44',true);
  // Animais celebrando
  const cels=['mico','tucano','boto','lobo','capivara','onca'];
  cels.forEach((k,i)=>{const s=SPR[k];X.drawImage(s,90+i*105,350,s.width*2.8,s.height*2.8);});
  px('ENTER para o menu',290,385,13,'#FFAA44',true);
}

// ─────────────────────────────────────────────────────────────
// PARTICLES
// ─────────────────────────────────────────────────────────────
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:25+Math.random()*20,col,sz:2+Math.random()*3});
  }
}

// ─────────────────────────────────────────────────────────────
// PHYSICS & GAME UPDATE
// ─────────────────────────────────────────────────────────────
function update(){
  frame++;
  if(GS!=='PLAYING')return;
  if(P.animalCard){P.cardTimer--;if(P.cardTimer<=0)P.animalCard=null;return;}

  const GRAV=0.44,SPD=3.4,JUMP=-10.5;
  let moving=false;

  if(keys['ArrowLeft']||keys['KeyA']){P.vx=-SPD;P.dir=-1;moving=true;}
  else if(keys['ArrowRight']||keys['KeyD']){P.vx=SPD;P.dir=1;moving=true;}
  else P.vx*=0.78;

  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&P.onGround){
    P.vy=JUMP;P.onGround=false;spawnParticles(P.x,P.y,'#8BC040',6);
  }

  // Binóculo (Q)
  if(keys['KeyQ']&&P.binTimer===0){
    P.binTimer=35;
    enemies.forEach(en=>{
      if(en.disabled>0)return;
      const ex=en.x,ey=en.y;
      const dist=Math.abs(ex-P.x);
      const sameDir=(P.dir>0&&ex>P.x)||(P.dir<0&&ex<P.x);
      if(dist<180&&sameDir&&Math.abs(ey-P.y)<100){
        en.disabled=280;spawnParticles(ex-camX,ey,'#90EE90',14);
      }
    });
  }
  if(P.binTimer>0)P.binTimer--;

  // Interagir com animais (E)
  if(keys['KeyE']){
    animals.forEach(an=>{
      if(!an.active)return;
      const dist=Math.hypot(P.x-an.x,P.y-an.y);
      if(dist<80){
        an.active=false;faunaCount++;bestiario[an.type]=true;
        P.animalCard=an.type;P.cardTimer=280;
        biomeUnlocked[Math.min(biome+1,3)]=true;
        spawnParticles(an.x-camX,an.y,'#FFDD44',18);
      }
    });
  }

  // Física
  P.vy+=GRAV;P.x+=P.vx;P.y+=P.vy;P.onGround=false;

  // Colisão plataformas
  platforms.forEach(plt=>{
    const pw=plt.ground?3200:plt.w;
    if(P.x+46>plt.x&&P.x+6<plt.x+pw){
      if(P.y+4>plt.y&&P.y+4<plt.y+26&&P.vy>=0){
        P.y=plt.y-4;P.vy=0;P.onGround=true;
      }
    }
  });

  if(P.x<30)P.x=30;
  if(P.y>480){P.hearts--;player_respawn();}

  // Win condition
  if(P.x>2150){
    if(biome<3){biome++;biomeUnlocked[biome]=true;initBiome(biome);}
    else GS='WIN';
  }

  // Câmera
  camX+=(P.x-250-camX)*0.09;
  if(camX<0)camX=0;

  // Animação walk
  if(moving&&P.onGround){
    P.walkTimer++;
    if(P.walkTimer>10){P.walkTimer=0;P.walkFrame=P.walkFrame===0?1:P.walkFrame===1?2:P.walkFrame===2?1:0;}
  }else if(P.onGround)P.walkFrame=0;

  // Invencibilidade
  if(P.invTimer>0)P.invTimer--;

  // Update inimigos
  enemies.forEach(en=>{
    en.f++;
    if(en.disabled>0){en.disabled--;return;}
    if(en.t==='robot'){
      en.x+=en.vx;if(en.x<en.sx||en.x>en.ex)en.vx*=-1;
    }else if(en.t==='drone'){
      en.x=en.sx+Math.sin(frame*0.025)*100;
    }
    // Dano ao player
    if(P.invTimer===0){
      const edx=en.t==='drone'?(en.x):(en.x);
      const edy=en.t==='drone'?(en.sx+(Math.sin(frame*0.04)*30)):(en.y);
      const dist=Math.hypot(P.x-edx,P.y-edy);
      const thresh=en.t==='pesado'?60:45;
      if(dist<thresh){
        P.hearts--;P.invTimer=90;P.vy=-7;P.vx=P.dir*-5;
        spawnParticles(P.x-camX,P.y,'#FF4444',8);
        if(P.hearts<=0)GS='GAMEOVER';
      }
    }
  });

  // Update animais
  animals.forEach(an=>an.f++);

  // Partículas
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;});
}

function player_respawn(){
  if(P.hearts<=0){GS='GAMEOVER';return;}
  P.x=150+camX;P.y=250;P.vy=0;P.vx=0;P.invTimer=120;
}

// ─────────────────────────────────────────────────────────────
// RENDER GAME
// ─────────────────────────────────────────────────────────────
function renderGame(){
  // Background
  switch(biome){
    case 0:drawBG_MataAtlantica();break;case 1:drawBG_Amazonia();break;
    case 2:drawBG_Cerrado();break;case 3:drawBG_Pantanal();break;
  }

  X.save();X.translate(-Math.floor(camX),0);

  // Chão tileado
  const gPlt=platforms.find(p=>p.ground);
  if(gPlt)drawPlatform(gPlt);
  // Plataformas
  platforms.filter(p=>!p.ground).forEach(p=>drawPlatform(p));

  // Cipós no bioma 0
  if(biome===0){
    for(let i=0;i<8;i++){
      const cx=200+i*280;
      X.drawImage(SPR.cipo,cx,0,SPR.cipo.width*2,SPR.cipo.height);
    }
  }

  // Animais
  animals.forEach(an=>drawAnimalSprite(an));
  // Inimigos
  enemies.forEach(en=>drawEnemy(en));
  // Leo
  drawLeo();
  // Partículas
  particles.forEach(p=>{
    X.globalAlpha=p.life/45;X.fillStyle=p.col;X.fillRect(p.x,p.y,p.sz,p.sz);
  });X.globalAlpha=1;

  // Flag / meta
  const flagX=2120;
  X.fillStyle='#888';X.fillRect(flagX,340,4,85);
  X.fillStyle='#2AFF2A';X.beginPath();X.moveTo(flagX+4,340);X.lineTo(flagX+38,354);X.lineTo(flagX+4,368);X.closePath();X.fill();
  px('META',flagX-8,330,12,'#FFDD00',true);

  X.restore();

  // HUD
  drawHUD();
  // Animal card
  if(P.animalCard)drawAnimalCard();

  // Fase announcement
  if(frame<160){
    const al=frame<100?1:(160-frame)/60;
    X.globalAlpha=al;
    X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(180,195,440,70);
    X.strokeStyle='#4AFF4A';X.lineWidth=3;X.strokeRect(182,197,436,66);
    px(`FASE ${biome+1}/4 — ${BIOME_NAMES[biome].toUpperCase()}`,220,235,17,'#FFDD44',true);
    X.globalAlpha=1;
  }

  // Controles hint
  X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,462,800,38);
  px('← →: Mover   ESPAÇO: Pular   Q: Binóculo Solar   E: Catalogar   ESC: Menu',65,483,10,'#6A9A6A');
}

// ─────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────
function loop(){
  X.imageSmoothingEnabled=false;
  X.clearRect(0,0,800,500);
  update();
  switch(GS){
    case 'MENU':drawMenu();break;
    case 'BIOME_SELECT':drawBiomeSelect();break;
    case 'BESTIARIO':drawBestiario();break;
    case 'PLAYING':renderGame();break;
    case 'GAMEOVER':renderGame();drawGameOver();break;
    case 'WIN':drawWin();break;
  }
  requestAnimationFrame(loop);
}

initBiome(0);
loop();
</script>
